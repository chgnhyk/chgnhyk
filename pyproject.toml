[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chgnhyk"
version = "0.0.27"
description = "visual engine of chgnhyk"
readme = "README.md"
requires-python = ">=3.9.0"
dependencies = [
    "moderngl",
    "numpy",
    "pillow",
    "svgpathtools",
    "trimesh",
    "pyrr"
]

[project.optional-dependencies]
opencv = [
    "opencv-python"
]

video = [
    "moviepy>=2.2.1",
    "av"
]

mediapipe = [
    "numpy==1.26.4",
    "mediapipe"
]
audio = [
    "csoundengine"
]
window = [
    "moderngl_window",
    "glfw"
]

[tool.hatch.build.targets.wheel]
packages = ["src/chgnhyk"]